%dev.quarkus.datasource.db-kind=sqlite
%dev.quarkus.datasource.jdbc.driver=org.sqlite.JDBC
%dev.quarkus.datasource.jdbc.url=jdbc:sqlite:./boka_stuga
%dev.proxy.jwt-token/mp-rest/url=http://localhost:8081/

quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:mem:bokastuga
%dev.quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.http.cors=true
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.origins=*
quarkus.http.cors.headers=*
quarkus.http.cors.methods=*
quarkus.smallrye-openapi.path=/swagger
quarkus.swagger-ui.always-include=true
mp.jwt.verify.issuer=jwt-token
smallrye.jwt.sign.key.location=privateKey.pem
mp.jwt.verify.publickey=publicKey.pem